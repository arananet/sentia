name: anvil-execute

# Execute mode line for Sentia work order wo-gh-1 (issue 1): elevate the
# launch page to flagship product standard. Separate execute workflow for
# the same reasons as in anvil-example-taskline: it needs contents: write
# (it commits the run evidence and the station made changes back to the
# trigger branch) and execute mode stays opt in per work order.
#
# Model routing for this run (ANVIL policy, recorded in anvil.yaml):
# the builder station runs GPT-6 Astra through OpenCode against the
# Cloudflare AI Gateway OpenAI compat route; spec writer, test writer and
# the four reviewers run claude-sonnet-5-5 through Claude Code against the
# gateway Anthropic route. tools/anvil_station.py dispatches per station.
# There is no fallback from Astra to another model for the builder: if the
# Astra smoke gate fails, this job stops before the line runs.
#
# Deployment is deliberately NOT part of this run: anvil.yaml carries no
# deploy config, so the deployer station stays a packet. The operator
# deploys after approval, outside the line.
#
# Trigger: the vault PAT cannot dispatch workflows or apply labels, so the
# trigger is a push to the anvil/run-ui-astra branch, plus manual dispatch.
# The commit this workflow pushes back uses GITHUB_TOKEN, which does not
# retrigger workflows, so the run cannot loop on its own push.
on:
  push:
    branches: [anvil/run-ui-astra]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anvil-execute-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  anvil-execute:
    name: Run the ANVIL line (Astra builds the UI, Sonnet 5.5 reviews)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_BASE_URL: https://gateway.ai.cloudflare.com/v1/693ae9c587f1f2c34328bb47447366b0/arananet-ai-gateway/anthropic
      ANTHROPIC_API_KEY: ${{ secrets.CF_AIG_TOKEN }}
      ANTHROPIC_CUSTOM_HEADERS: "cf-aig-authorization: Bearer ${{ secrets.CF_AIG_TOKEN }}"
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the ANVIL factory
        uses: actions/checkout@v4
        with:
          repository: arananet/anvil-factory
          path: .anvil-factory

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code and OpenCode
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g opencode-ai@1.19.5
          claude --version
          opencode --version

      - name: Anthropic smoke gate (claude-sonnet-5-5 through the gateway)
        id: smoke_anthropic
        run: |
          REPLY=$(claude -p "Reply with exactly: GATEWAY_OK" --model claude-sonnet-5-5 --output-format text)
          echo "Gateway reply: ${REPLY}"
          CLEAN=$(printf '%s' "${REPLY}" | tr -d '[:space:]')
          if [ "${CLEAN}" != "GATEWAY_OK" ]; then
            echo "Anthropic smoke failed: expected GATEWAY_OK and got the reply above. Stopping before the line runs."
            exit 1
          fi
          echo "Anthropic smoke passed: claude-sonnet-5-5 answered through the gateway Anthropic endpoint."

      - name: Astra smoke gate (gpt-6-astra through the gateway OpenAI route)
        id: smoke_astra
        run: |
          timeout 420 opencode run "Reply with exactly: ASTRA_OK" -m cloudflare-ai-gateway/openai/gpt-6-astra > astra-smoke.txt 2>&1 || true
          tail -c 3000 astra-smoke.txt || true
          if ! grep -q "ASTRA_OK" astra-smoke.txt; then
            echo "ASTRA SMOKE FAILED: the output above does not contain ASTRA_OK. The gateway OpenAI route did not answer with gpt-6-astra. Stopping here: no fallback to another model for UI work. The raw output is in astra-smoke.txt and in the uploaded artifacts."
            echo "OpenCode log tail for diagnosis:"
            tail -c 3000 ~/.local/share/opencode/log/*.log 2>/dev/null || echo "(no opencode log file found)"
            exit 1
          fi
          echo "Astra smoke passed: gpt-6-astra answered through the gateway OpenAI compat endpoint."

      - name: Run the ANVIL sdlc-default line in execute mode
        id: line
        if: steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          PYTHONPATH=.anvil-factory python3 -m anvil.cli run . \
            --pipeline .anvil-factory/pipelines/sdlc-default.json \
            --work-order work-orders/issue-1.json \
            --execute

      - name: Run the project test suite after the line
        id: suite
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          npm test > suite-output.txt 2>&1
          echo "SUITE_EXIT=$?" >> suite-result.txt
          cat suite-output.txt

      - name: Commit the run evidence and the station changes back to the branch
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat > run-diff.txt || true
          if git diff --cached --quiet; then
            echo "The run produced no file changes to commit."
            exit 0
          fi
          VERDICT=$(python3 -c "import json; print(json.load(open('runs/wo-gh-1/report.json'))['verdict'])" 2>/dev/null || echo "no-report")
          git commit -m "ANVIL execute run wo-gh-1 (issue 1): verdict ${VERDICT}" -m "Builder station executed by GPT-6 Astra (OpenCode) through the Cloudflare AI Gateway; spec, test and reviewer stations executed by Claude Code (claude-sonnet-5-5). Run evidence in runs/wo-gh-1/."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Comment the run report on issue 1
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          run_url = os.environ["RUN_URL"]
          branch = os.environ["BRANCH"]
          report_path = Path("runs/wo-gh-1/report.json")
          if not report_path.exists():
              lines = [
                  "## ANVIL execute run report",
                  "",
                  "The executed run did not produce a report.json, so there is no verdict to report. "
                  f"See the workflow run for the failure: {run_url}",
              ]
              Path("comment.md").write_text("\n".join(lines) + "\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          decision = report.get("decision", {})
          suite = ""
          sr = Path("suite-result.txt")
          if sr.exists():
              suite = "pass" if "SUITE_EXIT=0" in sr.read_text() else "FAIL (see suite-output.txt in the run commit)"
          lines = [
              "## ANVIL execute run report",
              "",
              f"Work order: {report['work_order_id']}",
              f"Pipeline: {report['pipeline']}",
              f"Approver verdict: {report['verdict']}",
              f"Human review required: {report['human_required']}",
              f"Deployment status: {report.get('deployment_status')}",
              f"Project test suite after the run: {suite or 'not recorded'}",
              "",
              "Decision record:",
              f"- Approver: {decision.get('approver', {}).get('rule', '')}",
              f"- Human gate: {decision.get('human_gate', {}).get('rule', '')}",
              "",
              "| Station | Status | Configured model | Executed model |",
              "|---|---|---|---|",
          ]
          for step in report.get("steps", []):
              lines.append(
                  f"| {step['station']} | {step['status']} | "
                  f"{step.get('configured_model')} | {step.get('executed_model')} |"
              )
          diff_path = Path("run-diff.txt")
          if diff_path.exists() and diff_path.read_text().strip():
              lines += ["", f"Files changed by the run (committed to `{branch}`):", "", "```", diff_path.read_text().strip(), "```"]
          lines += [
              "",
              "Honest note: this run EXECUTED its agent stations with per station model routing. "
              "The builder (the UI work) ran GPT-6 Astra through OpenCode against the Cloudflare AI Gateway "
              "OpenAI compat route; spec writer, test writer and the four reviewers ran claude-sonnet-5-5 "
              "through Claude Code against the gateway Anthropic route. Both routes passed an exact reply "
              "smoke gate before the line ran. The deployer station stayed a packet on purpose: deployment "
              "for this work order happens outside the line, by the operator, after approval.",
              f"Workflow run: {run_url}",
          ]
          Path("comment.md").write_text("\n".join(lines) + "\n")
          print(f"Verdict: {report['verdict']}")
          PYEOF
          gh issue comment 1 --body-file comment.md

      - name: Upload the run directory
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: anvil-execute-run-wo-gh-1
          path: |
            runs/
            astra-smoke.txt
            suite-output.txt
          if-no-files-found: ignore
