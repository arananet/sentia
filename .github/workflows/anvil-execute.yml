name: anvil-execute

# Execute mode line for Sentia work order wo-gh-1 (issue 1): elevate the
# launch page to flagship product standard. Separate execute workflow for
# the same reasons as in anvil-example-taskline: it needs contents: write
# (it commits the run evidence and the station made changes back to the
# trigger branch) and execute mode stays opt in per work order.
#
# Model routing for this run (ANVIL policy, recorded in anvil.yaml):
# the builder station runs GPT-6 Astra through Codex (custom model
# provider) against the Cloudflare unified AI endpoints on
# api.cloudflare.com (base /client/v4/accounts/<account>/ai/v1, header
# cf-aig-gateway-id selecting arananet-ai-gateway), authenticated with
# the dedicated account API token held in the CF_AI_API_TOKEN secret;
# Unified Billing covers the OpenAI provider on that endpoint family.
# Spec writer, test writer and four of the five reviewers run claude-sonnet-5-5
# through Claude Code against the gateway Anthropic route (CF_AIG_TOKEN);
# reviewer-design runs gpt-6-astra through the same Codex route as the
# builder, in the Astra wrapper's reviewer mode. Codex's bubblewrap
# sandbox cannot run on GitHub hosted runners (run 40799301315 lost both
# Astra stations to it), so Codex runs with full access here and reviewer
# read only is enforced by the wrapper's before and after worktree diff.
# tools/anvil_station.py dispatches per station. There is no fallback
# from Astra to another model for the builder: if the Astra smoke gate
# fails, this job stops before the line runs. (The gateway's classic
# provider endpoints were wired first and failed with 401: they require
# a stored BYOK provider key and do not apply Unified Billing fallback.
# OpenCode also failed twice in the AI SDK provider layer. See
# tools/astra_station.py for the full record.)
#
# Deployment is deliberately NOT part of this run: anvil.yaml carries no
# deploy config, so the deployer station stays a packet. The operator
# deploys after approval, outside the line.
#
# Trigger: the vault PAT cannot dispatch workflows or apply labels, so the
# trigger is a push to the anvil/run-ui-astra branch, plus manual dispatch.
# The commit this workflow pushes back uses GITHUB_TOKEN, which does not
# retrigger workflows, so the run cannot loop on its own push.
#
# Work order selection is by branch: anvil/run-ui-astra runs wo-gh-1
# (work-orders/issue-1.json, reports on issue 1) and anvil/run-design-v2
# runs wo-gh-2 (work-orders/issue-2.json, reports on issue 2, the imagery
# first design v2) and anvil/run-design-v2-1 runs wo-gh-3
# (work-orders/issue-3.json, reports on issue 3, the corrected render set
# and design knowledge pack recomposition) and anvil/run-credit-line
# runs wo-gh-4 (work-orders/issue-4.json, reports on issue 4, the footer
# credit line) and anvil/run-design-v3
# runs wo-gh-5 (work-orders/issue-5.json, reports on issue 5, the product
# first design v3 driven by the verified learnings in the brain) and anvil/run-design-v4
# runs wo-gh-6 (work-orders/issue-6.json, reports on issue 6, the square
# low profile product with all imagery regenerated at production quality) and anvil/run-s11-fix
# runs wo-gh-7 (work-orders/issue-7.json, reports on issue 7, the S11
# semantic assertion test fix) and anvil/run-imagery-consistency
# runs wo-gh-8 (work-orders/issue-8.json, reports on issue 8, the imagery
# consistency pass anchored on the hero) and anvil/run-take-apart
# runs wo-gh-9 (work-orders/issue-9.json, reports on issue 9, the
# interactive take apart page driven by one simulation model) and anvil/run-s11-rebaseline
# runs wo-gh-10 (work-orders/issue-10.json, reports on issue 10, the
# S11 owner acceptance re-baseline). The Select work order step
# sets the file, id and issue
# used by the line, commit back and comment steps. Model routing is the
# same for both work orders.
on:
  push:
    branches: [anvil/run-ui-astra, anvil/run-design-v2, anvil/run-design-v2-1, anvil/run-credit-line, anvil/run-design-v3, anvil/run-design-v4, anvil/run-s11-fix, anvil/run-imagery-consistency, anvil/run-take-apart, anvil/run-s11-rebaseline]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anvil-execute-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  anvil-execute:
    name: Run the ANVIL line (Astra builds the UI, Sonnet 5.5 reviews)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_BASE_URL: https://gateway.ai.cloudflare.com/v1/693ae9c587f1f2c34328bb47447366b0/arananet-ai-gateway/anthropic
      ANTHROPIC_API_KEY: ${{ secrets.CF_AIG_TOKEN }}
      ANTHROPIC_CUSTOM_HEADERS: "cf-aig-authorization: Bearer ${{ secrets.CF_AIG_TOKEN }}"
      CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
      CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Select work order for this branch
        id: wo
        run: |
          if [ "${GITHUB_REF_NAME}" = "anvil/run-s11-rebaseline" ]; then
            echo "file=work-orders/issue-10.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-10" >> "${GITHUB_OUTPUT}"
            echo "issue=10" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-take-apart" ]; then
            echo "file=work-orders/issue-9.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-9" >> "${GITHUB_OUTPUT}"
            echo "issue=9" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-imagery-consistency" ]; then
            echo "file=work-orders/issue-8.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-8" >> "${GITHUB_OUTPUT}"
            echo "issue=8" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-s11-fix" ]; then
            echo "file=work-orders/issue-7.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-7" >> "${GITHUB_OUTPUT}"
            echo "issue=7" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-design-v4" ]; then
            echo "file=work-orders/issue-6.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-6" >> "${GITHUB_OUTPUT}"
            echo "issue=6" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-design-v3" ]; then
            echo "file=work-orders/issue-5.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-5" >> "${GITHUB_OUTPUT}"
            echo "issue=5" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-credit-line" ]; then
            echo "file=work-orders/issue-4.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-4" >> "${GITHUB_OUTPUT}"
            echo "issue=4" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-design-v2-1" ]; then
            echo "file=work-orders/issue-3.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-3" >> "${GITHUB_OUTPUT}"
            echo "issue=3" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_REF_NAME}" = "anvil/run-design-v2" ]; then
            echo "file=work-orders/issue-2.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-2" >> "${GITHUB_OUTPUT}"
            echo "issue=2" >> "${GITHUB_OUTPUT}"
          else
            echo "file=work-orders/issue-1.json" >> "${GITHUB_OUTPUT}"
            echo "id=wo-gh-1" >> "${GITHUB_OUTPUT}"
            echo "issue=1" >> "${GITHUB_OUTPUT}"
          fi
          echo "Selected: $(tr '\n' ' ' < "${GITHUB_OUTPUT}")"

      - name: Check out the ANVIL factory
        uses: actions/checkout@v4
        with:
          repository: arananet/anvil-factory
          path: .anvil-factory

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code and Codex
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
          claude --version
          codex --version

      - name: Anthropic smoke gate (claude-sonnet-5-5 through the gateway)
        id: smoke_anthropic
        run: |
          REPLY=$(claude -p "Reply with exactly: GATEWAY_OK" --model claude-sonnet-5-5 --output-format text)
          echo "Gateway reply: ${REPLY}"
          CLEAN=$(printf '%s' "${REPLY}" | tr -d '[:space:]')
          if [ "${CLEAN}" != "GATEWAY_OK" ]; then
            echo "Anthropic smoke failed: expected GATEWAY_OK and got the reply above. Stopping before the line runs."
            exit 1
          fi
          echo "Anthropic smoke passed: claude-sonnet-5-5 answered through the gateway Anthropic endpoint."

      - name: Astra smoke gate (gpt-6-astra through the unified /ai endpoints)
        id: smoke_astra
        run: |
          # All smoke scratch lives in the runner temp directory, never in
          # the worktree: a previous run left astra-smoke.txt at the repo
          # root and the reviewers flagged it as outside the allowed
          # change paths. The output is printed in this step's log.
          SMOKE_DIR="${RUNNER_TEMP}/astra-smoke"
          mkdir -p "${SMOKE_DIR}"
          export CODEX_HOME="${SMOKE_DIR}/codex-home"
          mkdir -p "${CODEX_HOME}"
          cat > "${CODEX_HOME}/config.toml" <<'EOF'
          model = "openai/gpt-6-astra"
          model_provider = "cloudflare"
          [model_providers.cloudflare]
          name = "Cloudflare Unified AI (AI Gateway: arananet-ai-gateway)"
          base_url = "https://api.cloudflare.com/client/v4/accounts/693ae9c587f1f2c34328bb47447366b0/ai/v1"
          env_key = "CF_AI_API_TOKEN"
          wire_api = "responses"
          http_headers = { "cf-aig-gateway-id" = "arananet-ai-gateway" }
          EOF
          timeout 420 codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox --output-last-message "${SMOKE_DIR}/astra-last.txt" "Reply with exactly: ASTRA_OK" < /dev/null > "${SMOKE_DIR}/astra-smoke.txt" 2>&1 || true
          tail -c 3000 "${SMOKE_DIR}/astra-smoke.txt" || true
          if ! grep -q "ASTRA_OK" "${SMOKE_DIR}/astra-last.txt" 2>/dev/null; then
            echo "ASTRA SMOKE FAILED: codex did not return ASTRA_OK from gpt-6-astra through the unified /ai endpoints on api.cloudflare.com. The raw output above is the exact error. Stopping here: no fallback to another model for UI work."
            exit 1
          fi
          echo "Astra smoke passed: gpt-6-astra answered through the unified /ai endpoint (Codex, Responses API, AI Gateway header)."

      - name: Run the ANVIL sdlc-default line in execute mode
        id: line
        if: steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          PYTHONPATH=.anvil-factory python3 -m anvil.cli run . \
            --pipeline .anvil-factory/pipelines/sdlc-default.json \
            --work-order ${{ steps.wo.outputs.file }} \
            --execute

      - name: Run the project test suite after the line
        id: suite
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          npm test > suite-output.txt 2>&1
          echo "SUITE_EXIT=$?" >> suite-result.txt
          cat suite-output.txt

      - name: Commit the run evidence and the station changes back to the branch
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat > run-diff.txt || true
          if git diff --cached --quiet; then
            echo "The run produced no file changes to commit."
            exit 0
          fi
          VERDICT=$(python3 -c "import json; print(json.load(open('runs/${{ steps.wo.outputs.id }}/report.json'))['verdict'])" 2>/dev/null || echo "no-report")
          git commit -m "ANVIL execute run ${{ steps.wo.outputs.id }} (issue ${{ steps.wo.outputs.issue }}): verdict ${VERDICT}" -m "Builder station executed by GPT-6 Astra (Codex) through the Cloudflare AI Gateway; spec, test and reviewer stations executed by Claude Code (claude-sonnet-5-5). Run evidence in runs/${{ steps.wo.outputs.id }}/."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Comment the run report on the issue
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          WO_ID: ${{ steps.wo.outputs.id }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          run_url = os.environ["RUN_URL"]
          branch = os.environ["BRANCH"]
          report_path = Path("runs") / os.environ["WO_ID"] / "report.json"
          if not report_path.exists():
              lines = [
                  "## ANVIL execute run report",
                  "",
                  "The executed run did not produce a report.json, so there is no verdict to report. "
                  f"See the workflow run for the failure: {run_url}",
              ]
              Path("comment.md").write_text("\n".join(lines) + "\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          decision = report.get("decision", {})
          suite = ""
          sr = Path("suite-result.txt")
          if sr.exists():
              suite = "pass" if "SUITE_EXIT=0" in sr.read_text() else "FAIL (see suite-output.txt in the run commit)"
          lines = [
              "## ANVIL execute run report",
              "",
              f"Work order: {report['work_order_id']}",
              f"Pipeline: {report['pipeline']}",
              f"Approver verdict: {report['verdict']}",
              f"Human review required: {report['human_required']}",
              f"Deployment status: {report.get('deployment_status')}",
              f"Project test suite after the run: {suite or 'not recorded'}",
              "",
              "Decision record:",
              f"- Approver: {decision.get('approver', {}).get('rule', '')}",
              f"- Human gate: {decision.get('human_gate', {}).get('rule', '')}",
              "",
              "| Station | Status | Configured model | Executed model |",
              "|---|---|---|---|",
          ]
          for step in report.get("steps", []):
              lines.append(
                  f"| {step['station']} | {step['status']} | "
                  f"{step.get('configured_model')} | {step.get('executed_model')} |"
              )
          diff_path = Path("run-diff.txt")
          if diff_path.exists() and diff_path.read_text().strip():
              lines += ["", f"Files changed by the run (committed to `{branch}`):", "", "```", diff_path.read_text().strip(), "```"]
          lines += [
              "",
              "Honest note: this run EXECUTED its agent stations with per station model routing. "
              "The builder (the UI work) ran GPT-6 Astra through Codex (custom model provider, "
              "Responses API) against the Cloudflare unified AI endpoints on api.cloudflare.com "
              "with the cf-aig-gateway-id header selecting the AI Gateway (Unified Billing covers "
              "the OpenAI provider there); spec writer, test "
              "writer and four reviewers ran claude-sonnet-5-5 "
              "through Claude Code against the gateway Anthropic route, and reviewer-design ran "
              "gpt-6-astra through Codex in reviewer mode, with read only enforced by the Astra "
              "wrapper's before and after worktree diff (the Codex bubblewrap sandbox cannot run "
              "on GitHub hosted runners, so Codex itself runs with full access). Both routes passed an exact reply "
              "smoke gate before the line ran. The deployer station stayed a packet on purpose: deployment "
              "for this work order happens outside the line, by the operator, after approval.",
              f"Workflow run: {run_url}",
          ]
          Path("comment.md").write_text("\n".join(lines) + "\n")
          print(f"Verdict: {report['verdict']}")
          PYEOF
          gh issue comment ${{ steps.wo.outputs.issue }} --body-file comment.md

      - name: Upload the run directory
        if: always() && steps.smoke_anthropic.outcome == 'success' && steps.smoke_astra.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: anvil-execute-run-${{ steps.wo.outputs.id }}
          path: |
            runs/
            suite-output.txt
          if-no-files-found: ignore
